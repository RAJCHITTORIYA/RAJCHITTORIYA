    <rect x="902" y="224" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="917" cy="240" r="3" fill="#D2A8FF" />
    <text x="929" y="244" class="skill-text">Linux</text>

    <!-- Row 2 -->
    <rect x="578" y="266" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="593" cy="282" r="3" fill="#A371F7" />
    <text x="605" y="286" class="skill-text">VS Code</text>

    <rect x="740" y="266" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
