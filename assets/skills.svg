    <circle cx="36" cy="33" r="3.5" fill="#00F0FF" />
    <text x="48" y="37" class="category-title" fill="url(#progGrad)">01. PROGRAMMING</text>
    <text x="525" y="37" text-anchor="end" class="category-sub">LANGUAGES</text>

    <!-- Row 1 -->
    <rect x="38" y="62" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="53" cy="78" r="3" fill="#00F0FF" />
    <text x="65" y="82" class="skill-text">Java</text>

    <rect x="200" y="62" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="215" cy="78" r="3" fill="#00F0FF" />
    <text x="227" y="82" class="skill-text">Python</text>

    <rect x="362" y="62" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="377" cy="78" r="3" fill="#00F0FF" />
