    <!-- Row 1 -->
    <rect x="578" y="224" width="150" height="32" rx="6" fill="url(#badgeBg)" stroke="#21262D" stroke-width="1" />
    <circle cx="593" cy="240" r="3" fill="#D2A8FF" />
