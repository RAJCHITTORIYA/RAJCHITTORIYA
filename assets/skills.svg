<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11161D" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#12171E" />
    </linearGradient>

    <!-- Category Header Gradients -->
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB86C" />
      <stop offset="100%" stop-color="#FF9E3B" />
    </linearGradient>

    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EE787" />
      <stop offset="100%" stop-color="#56D364" />
    </linearGradient>

    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A8FF" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', 'Courier New', monospace;
      }
      .card {
        transition: transform 0.2s ease;
      }
      .skill-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #E6EDF3;
        font-weight: 500;
      }
      .category-title {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .category-sub {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #484F58;
      }
    </style>
  </defs>

  <!-- ========================================== -->
  <!-- CARD 1: PROGRAMMING (Top Left)            -->
  <!-- ========================================== -->
  <g class="card">
    <rect x="20" y="18" width="520" height="145" rx="12" fill="url(#cardBg)" stroke="#30363D" stroke-width="1.2" />
    <path d="M 20,30 Q 20,18 32,18 L 528,18 Q 540,18 540,30 L 540,48 L 20,48 Z" fill="#161B22" />
