name: Update Dynamic Profile & Sync Stats

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Dynamic Profile Updater
        run: |
          python .github/scripts/update_profile.py

      - name: Commit & Push if Changes Detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Auto-update dynamic profile & projects [skip ci]"
            git push
          else
            echo "Profile is completely up-to-date. No commit needed."
          fi
